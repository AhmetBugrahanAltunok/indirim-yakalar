[pytest]
testpaths = tests

# Geçici dosyalar repo içine alındı. Varsayılan yer
# (%LOCALAPPDATA%\Temp\pytest-of-<kullanıcı>) bu makinede erişilemez izinlerle
# kalmış durumda ve `tmp_path` kullanan HER test toplanma anında
# PermissionError ile patlıyordu (27.07.2026).
#
# ⚠️ Buraya verilen klasörün içi her koşuda pytest tarafından SİLİNİR.
# Repo dışına ya da içinde iş dosyası olan bir yola çevirmeyin.
addopts = --basetemp=.pytest-tmp
